<body>
<div class="wrap">
  <div class="card">

    <h1>🚒 Help the Fire Truck!</h1>

    <div class="instructions">
      Drive the fire truck through the maze and find the exit!
    </div>

    <div class="game-layout">

      <div class="maze-area">
        <canvas id="maze" width="900" height="600"
          aria-label="Interactive fire truck maze"></canvas>
      </div>

      <aside class="sidebar">
        <div class="counter-card">
          <div class="counter-icon">💥</div>
          <div>
            <div class="counter-label">Bumps</div>
            <div class="counter-number" id="bumps">0</div>
          </div>
          <div class="counter-help">
            Try not to hit the walls!
          </div>
        </div>
      </aside>

    </div>

    <div class="status" id="status" aria-live="polite">
      Use the arrow keys to drive! 🚒
    </div>

    <div class="keyboard-help">
      ⌨️ Use the <strong>arrow keys on your keyboard</strong>
      <br>
      <span>
        ⬆️ Up &nbsp;&nbsp; ⬇️ Down &nbsp;&nbsp;
        ⬅️ Left &nbsp;&nbsp; ➡️ Right
      </span>
    </div>

    <div class="actions">
      <button id="reset" type="button">🔄 New Maze</button>
    </div>

  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("maze");
  const ctx = canvas.getContext("2d");
  const status = document.getElementById("status");
  const bumpsDisplay = document.getElementById("bumps");

  const ROWS = 15;
  const COLS = 21;
  const cellW = canvas.width / COLS;
  const cellH = canvas.height / ROWS;

  const start = { r: 1, c: 1 };
  const exit = { r: ROWS - 2, c: COLS - 2 };

  let grid = [];
  let player = { ...start };
  let won = false;
  let bumps = 0;

  // Audio is created when needed, after the player presses a key.
  let audioContext = null;

  function getAudioContext() {
    if (!audioContext) {
      const AudioCtx =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioCtx) return null;

      audioContext = new AudioCtx();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    return audioContext;
  }

  // Short, funny bump sound.
  function playBumpSound() {
    const audio = getAudioContext();
    if (!audio) return;

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
      180, audio.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      75, audio.currentTime + 0.12
    );

    gain.gain.setValueAtTime(
      0.18, audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001, audio.currentTime + 0.15
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.15);
  }

  // Happy three-note victory melody.
  function playWinSound() {
    const audio = getAudioContext();
    if (!audio) return;

    const notes = [
      { frequency: 523.25, start: 0, duration: 0.18 },
      { frequency: 659.25, start: 0.18, duration: 0.18 },
      { frequency: 783.99, start: 0.36, duration: 0.18 },
      { frequency: 1046.50, start: 0.54, duration: 0.45 }
    ];

    notes.forEach(note => {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      const startTime = audio.currentTime + note.start;

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(
        note.frequency, startTime
      );

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(
        0.22, startTime + 0.025
      );
      gain.gain.setValueAtTime(
        0.22, startTime + note.duration * 0.65
      );
      gain.gain.exponentialRampToValueAtTime(
        0.001, startTime + note.duration
      );

      oscillator.connect(gain);
      gain.connect(audio.destination);

      oscillator.start(startTime);
      oscillator.stop(startTime + note.duration);
    });
  }

  function makeMaze() {
    grid = Array.from(
      { length: ROWS },
      () => Array(COLS).fill(1)
    );

    const stack = [{ r: 1, c: 1 }];
    grid[1][1] = 0;

    while (stack.length) {
      const current = stack[stack.length - 1];

      const dirs = [
        { dr: -2, dc: 0 },
        { dr: 2, dc: 0 },
        { dr: 0, dc: -2 },
        { dr: 0, dc: 2 }
      ];

      const options = [];

      for (const d of dirs) {
        const nr = current.r + d.dr;
        const nc = current.c + d.dc;

        if (
          nr > 0 && nr < ROWS - 1 &&
          nc > 0 && nc < COLS - 1 &&
          grid[nr][nc] === 1
        ) {
          options.push({
            dr: d.dr,
            dc: d.dc,
            nr,
            nc
          });
        }
      }

      if (!options.length) {
        stack.pop();
        continue;
      }

      const choice =
        options[Math.floor(Math.random() * options.length)];

      const middleR = current.r + choice.dr / 2;
      const middleC = current.c + choice.dc / 2;

      grid[middleR][middleC] = 0;
      grid[choice.nr][choice.nc] = 0;

      stack.push({
        r: choice.nr,
        c: choice.nc
      });
    }

    grid[exit.r][exit.c] = 0;
    grid[exit.r][exit.c - 1] = 0;
  }

  function drawFireTruck(x, y, w, h) {
    // Shadow
    ctx.fillStyle = "#0002";
    ctx.beginPath();
    ctx.ellipse(
      x + w / 2, y + h * 0.91,
      w * 0.42, h * 0.10,
      0, 0, Math.PI * 2
    );
    ctx.fill();

    // Body
    ctx.fillStyle = "#e53935";
    ctx.strokeStyle = "#991b1b";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.roundRect(
      x + w * 0.08, y + h * 0.35,
      w * 0.84, h * 0.42,
      h * 0.08
    );
    ctx.fill();
    ctx.stroke();

    // Cab
    ctx.beginPath();
    ctx.roundRect(
      x + w * 0.52, y + h * 0.18,
      w * 0.39, h * 0.52,
      h * 0.08
    );
    ctx.fill();
    ctx.stroke();

    // Windows
    ctx.fillStyle = "#bde9ff";
    ctx.fillRect(
      x + w * 0.59, y + h * 0.25,
      w * 0.13, h * 0.19
    );
    ctx.fillRect(
      x + w * 0.76, y + h * 0.25,
      w * 0.11, h * 0.19
    );

    // Ladder
    ctx.strokeStyle = "#e5e7eb";
    ctx.lineWidth = Math.max(2.5, w * 0.035);

    ctx.beginPath();
    ctx.moveTo(x + w * 0.18, y + h * 0.29);
    ctx.lineTo(x + w * 0.72, y + h * 0.08);
    ctx.moveTo(x + w * 0.22, y + h * 0.24);
    ctx.lineTo(x + w * 0.77, y + h * 0.04);
    ctx.stroke();

    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(
        x + w * (0.25 + i * 0.1),
        y + h * (0.25 - i * 0.038)
      );
      ctx.lineTo(
        x + w * (0.275 + i * 0.1),
        y + h * (0.31 - i * 0.038)
      );
      ctx.stroke();
    }

    // Wheels
    for (const q of [0.25, 0.72]) {
      ctx.fillStyle = "#172033";
      ctx.beginPath();
      ctx.arc(
        x + w * q, y + h * 0.79,
        w * 0.105, 0, Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "#94a3b8";
      ctx.beginPath();
      ctx.arc(
        x + w * q, y + h * 0.79,
        w * 0.045, 0, Math.PI * 2
      );
      ctx.fill();
    }

    // Siren
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(
      x + w * 0.68, y + h * 0.13,
      w * 0.055, 0, Math.PI * 2
    );
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff8e8";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * cellW;
        const y = r * cellH;

        if (grid[r][c] === 1) {
          ctx.fillStyle = "#334155";

          ctx.beginPath();
          ctx.roundRect(
            x + 1, y + 1,
            cellW - 2, cellH - 2, 5
          );
          ctx.fill();

          ctx.fillStyle = "#475569";
          ctx.fillRect(x + 4, y + 4, cellW - 8, 3);
        } else {
          ctx.fillStyle = "#fffaf0";
          ctx.fillRect(x, y, cellW, cellH);
        }
      }
    }

    // Exit
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `bold ${Math.min(cellW, cellH) * 0.52}px Arial`;

    ctx.fillText(
      "🏁",
      exit.c * cellW + cellW / 2,
      exit.r * cellH + cellH / 2
    );

    // Fire truck
    drawFireTruck(
      player.c * cellW + cellW * 0.05,
      player.r * cellH + cellH * 0.05,
      cellW * 0.90,
      cellH * 0.90
    );

    // Victory screen
    if (won) {
      ctx.fillStyle = "#16a34acc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      ctx.font =
        `900 ${Math.min(canvas.width * 0.075, 58)}px Arial`;

      ctx.fillText(
        "🎉 YOU DID IT! 🎉",
        canvas.width / 2,
        canvas.height * 0.43
      );

      ctx.font =
        `900 ${Math.min(canvas.width * 0.045, 34)}px Arial`;

      ctx.fillText(
        "The fire truck is out!",
        canvas.width / 2,
        canvas.height * 0.56
      );
    }
  }

  function move(dr, dc) {
    if (won) return;

    const nr = player.r + dr;
    const nc = player.c + dc;

    // Hit a wall or the edge of the maze.
    if (
      nr < 0 || nr >= ROWS ||
      nc < 0 || nc >= COLS ||
      grid[nr][nc] === 1
    ) {
      bumps++;
      bumpsDisplay.textContent = bumps;

      status.textContent = "💥 BUMP! Try another way!";
      playBumpSound();
      return;
    }

    player = { r: nr, c: nc };

    if (player.r === exit.r && player.c === exit.c) {
      won = true;

      status.textContent =
        "🎉 Great job! The fire truck escaped!";

      status.classList.add("win");

      playWinSound();
    } else {
      status.textContent = "🚒 Keep going!";
    }

    draw();
  }

  // Keyboard controls
  window.addEventListener("keydown", e => {
    const moves = {
      ArrowUp: [-1, 0],
      ArrowDown: [1, 0],
      ArrowLeft: [0, -1],
      ArrowRight: [0, 1]
    };

    if (moves[e.key]) {
      e.preventDefault();
      move(...moves[e.key]);
    }
  });

  // New maze resets the bump counter.
  document.getElementById("reset").addEventListener("click", () => {
    makeMaze();

    player = { ...start };
    won = false;
    bumps = 0;

    bumpsDisplay.textContent = "0";

    status.textContent =
      "🚒 New maze! Find the way out!";

    status.classList.remove("win");

    draw();
  });

  makeMaze();
  draw();
})();
</script>
</body>
</html>
